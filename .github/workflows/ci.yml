name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed artifacts
        run: python scripts/validate_repository.py
