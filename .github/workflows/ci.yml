name: CI

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check website data matches the pipeline tables
        run: python scripts/export_portfolio_data.py --check
      - name: Validate committed artifacts
        run: python scripts/validate_repository.py

  portfolio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - name: Install portfolio dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint portfolio
        run: pnpm run lint
      - name: Build static portfolio
        run: pnpm run build
      - name: Test rendered portfolio
        run: pnpm run test
